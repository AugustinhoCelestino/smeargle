<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Quadro Branco</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, sans-serif;
            background: white;
        }

        /* =========================
           BARRA DE FERRAMENTAS
           ========================= */

        .toolbar {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            min-height: 60px;

            display: flex;
            align-items: center;
            gap: 10px;

            padding:
                10px
                max(10px, env(safe-area-inset-right))
                10px
                max(10px, env(safe-area-inset-left));

            background: #222;
            color: white;

            z-index: 100;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .toolbar h1 {
            font-size: 18px;
            margin-right: auto;
            white-space: nowrap;
        }

        .toolbar button {
            border: none;
            border-radius: 8px;

            padding: 10px 14px;

            background: #444;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        .toolbar button:active {
            transform: scale(0.96);
        }

        .brush-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brush-control input {
            width: 90px;
        }

        .color-indicator {
            width: 25px;
            height: 25px;

            flex-shrink: 0;

            border-radius: 50%;

            border: 2px solid white;

            box-shadow:
                0 0 0 1px #777;
        }

        /* =========================
           QUADRO
           ========================= */

        .board {
            position: fixed;

            top: 60px;
            left: 0;

            width: 100%;
            height: calc(100% - 60px);

            background: white;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;

            cursor: crosshair;
        }

        /* =========================
           MODO FULLSCREEN
           ========================= */

        :fullscreen .toolbar {
            min-height: 55px;
        }

        :fullscreen .board {
            top: 55px;
            height: calc(100% - 55px);
        }

        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            .toolbar {
                min-height: 55px;

                padding: 8px;

                gap: 6px;
            }

            .toolbar h1 {
                display: none;
            }

            .brush-control span:first-child {
                display: none;
            }

            .brush-control input {
                width: 75px;
            }

            .toolbar button {
                padding: 9px 10px;
                font-size: 13px;
            }

            .color-indicator {
                width: 23px;
                height: 23px;
            }

            .board {
                top: 55px;
                height: calc(100% - 55px);
            }
        }

        /* =========================
           TELA MUITO PEQUENA
           ========================= */

        @media (max-width: 380px) {

            .brush-control input {
                width: 60px;
            }

            .toolbar button {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BARRA
         ========================= -->

    <div class="toolbar">

        <h1>🎨 Quadro Branco</h1>

        <div class="brush-control">

            <span>🖌️</span>

            <input
                id="brushSize"
                type="range"
                min="1"
                max="50"
                value="5"
            >

            <span id="brushSizeValue">
                5
            </span>

        </div>

        <div
            id="colorIndicator"
            class="color-indicator"
        ></div>

        <button id="clearButton">
            🗑️
        </button>

        <button id="fullscreenButton">
            ⛶
        </button>

    </div>


    <!-- =========================
         QUADRO
         ========================= -->

    <main class="board">

        <canvas id="canvas"></canvas>

    </main>


    <script>

        // =====================================
        // ELEMENTOS
        // =====================================

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const brushSize =
            document.getElementById("brushSize");

        const brushSizeValue =
            document.getElementById("brushSizeValue");

        const clearButton =
            document.getElementById("clearButton");

        const fullscreenButton =
            document.getElementById("fullscreenButton");

        const colorIndicator =
            document.getElementById("colorIndicator");


        // =====================================
        // VARIÁVEIS
        // =====================================

        let drawing = false;

        let currentColor = randomColor();


        // =====================================
        // CORES ALEATÓRIAS
        // =====================================

        function randomColor() {

            const r =
                Math.floor(Math.random() * 256);

            const g =
                Math.floor(Math.random() * 256);

            const b =
                Math.floor(Math.random() * 256);

            return `rgb(${r}, ${g}, ${b})`;
        }


        // =====================================
        // INDICADOR DE COR
        // =====================================

        function updateColorIndicator() {

            colorIndicator.style.backgroundColor =
                currentColor;
        }


        // =====================================
        // AJUSTAR CANVAS
        // =====================================

        function resizeCanvas() {

            const rect =
                canvas.getBoundingClientRect();

            const oldCanvas =
                document.createElement("canvas");

            oldCanvas.width =
                canvas.width;

            oldCanvas.height =
                canvas.height;

            const oldCtx =
                oldCanvas.getContext("2d");

            if (
                canvas.width > 0 &&
                canvas.height > 0
            ) {

                oldCtx.drawImage(
                    canvas,
                    0,
                    0
                );
            }

            canvas.width =
                rect.width;

            canvas.height =
                rect.height;

            // Fundo branco
            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Recupera desenho anterior
            if (
                oldCanvas.width > 0 &&
                oldCanvas.height > 0
            ) {

                ctx.drawImage(
                    oldCanvas,
                    0,
                    0,
                    oldCanvas.width,
                    oldCanvas.height,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );
            }
        }


        // =====================================
        // POSIÇÃO DO TOQUE / MOUSE
        // =====================================

        function getPosition(event) {

            const rect =
                canvas.getBoundingClientRect();

            return {

                x:
                    event.clientX -
                    rect.left,

                y:
                    event.clientY -
                    rect.top
            };
        }


        // =====================================
        // COMEÇAR DESENHO
        // =====================================

        function startDrawing(event) {

            event.preventDefault();

            drawing = true;

            // Nova cor para cada novo traço
            currentColor =
                randomColor();

            updateColorIndicator();

            const position =
                getPosition(event);

            ctx.beginPath();

            ctx.moveTo(
                position.x,
                position.y
            );

            drawDot(
                position.x,
                position.y
            );
        }


        // =====================================
        // DESENHAR
        // =====================================

        function draw(event) {

            if (!drawing) {
                return;
            }

            event.preventDefault();

            const position =
                getPosition(event);

            ctx.lineWidth =
                Number(brushSize.value);

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";

            ctx.strokeStyle =
                currentColor;

            ctx.lineTo(
                position.x,
                position.y
            );

            ctx.stroke();
        }


        // =====================================
        // PONTO
        // =====================================

        function drawDot(x, y) {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                Number(brushSize.value) / 2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                currentColor;

            ctx.fill();
        }


        // =====================================
        // PARAR DESENHO
        // =====================================

        function stopDrawing() {

            if (!drawing) {
                return;
            }

            drawing = false;

            ctx.closePath();
        }


        // =====================================
        // EVENTOS DE DESENHO
        // =====================================

        canvas.addEventListener(
            "pointerdown",
            startDrawing
        );

        canvas.addEventListener(
            "pointermove",
            draw
        );

        canvas.addEventListener(
            "pointerup",
            stopDrawing
        );

        canvas.addEventListener(
            "pointercancel",
            stopDrawing
        );

        canvas.addEventListener(
            "pointerleave",
            stopDrawing
        );


        // =====================================
        // TAMANHO DO PINCEL
        // =====================================

        brushSize.addEventListener(
            "input",
            () => {

                brushSizeValue.textContent =
                    brushSize.value;
            }
        );


        // =====================================
        // LIMPAR
        // =====================================

        clearButton.addEventListener(
            "click",
            () => {

                ctx.fillStyle =
                    "white";

                ctx.fillRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );
            }
        );


        // =====================================
        // FULLSCREEN
        // =====================================

        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (!document.fullscreenElement) {

                        await document.documentElement
                            .requestFullscreen();

                        fullscreenButton.textContent =
                            "✕";

                    } else {

                        await document.exitFullscreen();

                        fullscreenButton.textContent =
                            "⛶";
                    }

                } catch (error) {

                    console.log(
                        "Fullscreen não disponível:",
                        error
                    );
                }
            }
        );


        // =====================================
        // ATUALIZAR BOTÃO FULLSCREEN
        // =====================================

        document.addEventListener(
            "fullscreenchange",
            () => {

                if (document.fullscreenElement) {

                    fullscreenButton.textContent =
                        "✕";

                } else {

                    fullscreenButton.textContent =
                        "⛶";
                }

                // Recalcula tamanho do quadro
                setTimeout(
                    resizeCanvas,
                    100
                );
            }
        );


        // =====================================
        // INICIALIZAÇÃO
        // =====================================

        resizeCanvas();

        updateColorIndicator();


        // =====================================
        // REDIMENSIONAMENTO
        // =====================================

        window.addEventListener(
            "resize",
            () => {

                setTimeout(
                    resizeCanvas,
                    100
                );
            }
        );

    </script>

</body>
</html>
